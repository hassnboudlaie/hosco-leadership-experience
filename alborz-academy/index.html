*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.85;direction:rtl}a{text-decoration:none;color:inherit}button,textarea{font:inherit}.wrap{max-width:1160px;margin:auto;padding:0 20px}.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(9px)}.topin{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--navy),var(--teal));color:white;font-weight:800}.brand b{color:var(--navy);font-size:15px}.brand small{display:block;color:var(--muted);font-size:10px}.menu{display:flex;gap:7px}.menu a{padding:7px 10px;border-radius:9px;font-size:12px;color:#425b69}.menu a:hover{background:var(--ice)}.hero{padding:52px 0 34px;background:radial-gradient(circle at 15% 5%,#dff5f1,transparent 30%),linear-gradient(#fff,var(--bg))}.hero-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:26px;align-items:center}.tag{display:inline-block;background:var(--ice);color:var(--teal);padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700}.hero h1{font-size:34px;line-height:1.5;margin:13px 0 9px;color:var(--navy)}.hero p{color:var(--muted);margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 9px 26px rgba(18,58,90,.06)}.ring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;position:relative}.ring:after{content:"";width:82px;height:82px;background:white;border-radius:50%;position:absolute}.ring b{z-index:2;color:var(--navy);font-size:23px}.section{padding:30px 0}.section h2{color:var(--navy);margin:0 0 4px}.sub{color:var(--muted);font-size:12px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.module{background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px;position:relative;transition:.2s}.module:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(18,58,90,.08)}.num{position:absolute;left:16px;top:11px;font-size:31px;font-weight:800;color:#e8f0f2}.module h3{font-size:17px;color:var(--navy);margin:0 0 7px;padding-left:46px}.module p{font-size:12px;color:var(--muted);margin:0 0 12px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:3px 7px;border-radius:999px;background:#f1f7f8;color:#49616e;font-size:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);margin-top:12px;padding-top:11px;font-size:11px}.badge{padding:3px 8px;background:var(--ice);color:var(--teal);border-radius:999px}.btn{border:0;border-radius:10px;padding:9px 13px;background:var(--navy);color:#fff;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.teal{background:var(--teal)}.sessionHero{padding:32px 0 18px}.crumb{font-size:11px;color:var(--muted);margin-bottom:9px}.titleBox{background:linear-gradient(135deg,var(--navy),#1c697a);color:#fff;padding:25px;border-radius:20px}.titleBox h1{font-size:28px;margin:7px 0}.titleBox p{margin:0;color:#dcebf0}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.meta span{background:rgba(255,255,255,.12);padding:4px 8px;border-radius:999px;font-size:10px}.layout{display:grid;grid-template-columns:245px 1fr;gap:20px;align-items:start}.side{position:sticky;top:84px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}.side a{display:block;padding:7px 9px;font-size:11px;color:#506875;border-radius:8px}.side a:hover{background:var(--ice)}.content section{background:#fff;border:1px solid var(--line);border-radius:15px;padding:21px;margin-bottom:15px}.content h2{font-size:19px;color:var(--navy);margin:0 0 12px}.content ul{padding-right:20px;margin:4px 0}.content li{margin-bottom:5px}.note{background:#f2fbfa;border-right:4px solid var(--teal);border-radius:10px;padding:12px 14px;margin:9px 0}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool{background:#f7fafb;border:1px solid #e5edf0;border-radius:9px;padding:9px 11px;font-size:12px}.case{background:#f8fbfd;border-right:4px solid var(--navy);padding:14px;border-radius:10px}.coach{background:linear-gradient(135deg,#fff9eb,#fff)!important;border-color:#ead9ad!important}.quiz{border:1px solid var(--line);border-radius:11px;padding:13px;margin:10px 0}.quiz p{font-weight:700;margin-top:0}.opt{display:block;background:#f7fafb;padding:8px 9px;border-radius:8px;margin:6px 0;cursor:pointer}.result{display:none;margin-top:12px;background:var(--ice);padding:11px;border-radius:9px;font-weight:700;color:var(--navy)}textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fcfefe;resize:vertical}.donebox{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:12px}.donebox.done{background:#f4fbf7;border-color:#b6dfc8}.navrow{display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap;margin:22px 0 42px}.library{display:grid;gap:12px}.resource{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px}.resource h3{margin:4px 0;color:var(--navy)}.resource p{margin:0;color:var(--muted)}.guidegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.guideitem{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.footer{margin-top:30px;border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:11px}.save{font-size:11px;color:var(--ok);margin-right:8px}

var S=[
{id:1,t:"نقش رئیس شعبه در مدیریت ارتباطات و آداب معاشرت حرفه‌ای",s:"از شناخت ذی‌نفعان تا First Impression و Social Etiquette",c:["Stakeholder Map","First Impression","Etiquette"],o:"رئیس شعبه بتواند برای هر ذی‌نفع، کانال، لحن و رفتار حرفه‌ای متناسب انتخاب کند و اولین برخورد خود را آگاهانه مدیریت کند.",tp:["رئیس شعبه به‌عنوان نماینده برند و مدیر ارتباطات","نقشه ذی‌نفعان: کارکنان، ستاد، سایر شعب، نمایندگان و مشتریان","تفاوت هدف ارتباط با هر ذی‌نفع","انتخاب کانال، زمان و لحن مناسب","First Impression؛ سلام، معرفی، عناوین و Small Talk حرفه‌ای","خطاهای رایج در آداب معاشرت مدیریتی"],n:["قبل از هر گفت‌وگو روشن کنید: طرف مقابل باید بعد از این تعامل چه بداند، چه احساسی داشته باشد و چه اقدامی انجام دهد؟","در روابط حرفه‌ای، صمیمیت باید با مرزبندی همراه باشد.","اولین برخورد ترکیبی از ظاهر، لحن، توجه و احترام است؛ نه صرفاً لباس رسمی.","پایان حرفه‌ای یعنی جمع‌بندی توافق، اقدام بعدی و زمان پیگیری."],tools:["مدل 4C: Context → Contact → Conversation → Close","نام + عنوان مناسب + تماس چشمی","پرسش شروع: «چه موضوعی برای شما در این جلسه مهم‌تر است؟»","پایان: خلاصه توافق + اقدام بعدی + زمان"],case:"نماینده‌ای قدیمی بدون وقت قبلی وارد شعبه شده و هم‌زمان مشتری سازمانی مهمی منتظر جلسه است. نماینده انتظار دارد فوراً شما را ببیند. چگونه احترام رابطه و اولویت جلسه را هم‌زمان حفظ می‌کنید؟",ex:"نقشه ذی‌نفعان شعبه خود را رسم کنید و برای پنج ذی‌نفع، هدف ارتباط، حساسیت رابطه، کانال مناسب و یک رفتار ممنوع را مشخص کنید.",coach:"چه بخشی از «حضور حرفه‌ای» شما امروز به عادت تبدیل شده و دیگر آگاهانه آن را انتخاب نمی‌کنید؟",ref:"در کدام رابطه—کارکنان، ستاد، نمایندگان یا مشتری—بیشتر احتمال دارد لحن شما از هدف ارتباط فاصله بگیرد؟",asg:"در هفته آینده یک تعامل مهم را قبل از شروع با مدل 4C طراحی کنید و پس از پایان، نتیجه را در سه خط ثبت کنید.",q:[["بهترین نقطه شروع ارتباط حرفه‌ای چیست؟",["شروع سریع با اصل موضوع","شناخت هدف و مخاطب","لحن بسیار رسمی","پیام کتبی"],1],["First Impression بیشتر از چه ساخته می‌شود؟",["فقط پوشش","ظاهر، لحن، توجه و احترام","اصطلاحات تخصصی","طول صحبت"],1],["Small Talk حرفه‌ای چگونه است؟",["کوتاه، مرتبط و محترمانه","کاملاً شخصی","طولانی","حذف کامل"],0],["پایان حرفه‌ای گفت‌وگو شامل چیست؟",["فقط تشکر","خلاصه توافق و اقدام بعدی","قول کلی","تکرار کل جلسه"],1],["مرزبندی حرفه‌ای یعنی چه؟",["فاصله کامل","احترام و صمیمیت همراه با حدود نقش","بی‌اعتمادی","ارجاع همه چیز"],1]]},
{id:2,t:"تشریفات و Protocol برای رؤسای شعب",s:"میزبانی، تقدم، نشستن، استقبال و بازدیدهای رسمی",c:["Protocol","Hosting","VIP Visit"],o:"رئیس شعبه بتواند ملاقات‌ها و بازدیدهای رسمی را با رعایت تقدم، میزبانی و هماهنگی تیم شعبه مدیریت کند.",tp:["تفاوت Etiquette و Protocol","استقبال و بدرقه حرفه‌ای","تقدم و معرفی افراد","Seating Protocol","اصول میزبانی و پذیرایی","آماده‌سازی شعبه برای مدیران ارشد و مشتریان مهم"],n:["تشریفات خوب باید روان و بدون فشار برای مهمان اجرا شود.","قبل از بازدید، نقش هر عضو تیم را روشن کنید.","جای نشستن باید متناسب با هدف جلسه و جایگاه افراد باشد.","میزبانی حرفه‌ای یعنی توجه به جزئیات بدون افراط و نمایش."],tools:["چک‌لیست ۱۵ دقیقه قبل از ورود مهمان","قاعده معرفی بر اساس جایگاه","نقشه نشستن قبل از جلسه حساس","Brief تیم: مهمان کیست؟ هدف چیست؟ چه کسی چه می‌کند؟"],case:"معاون یک شرکت مشتری همراه دو مدیر برای جلسه تمدید وارد شعبه می‌شود و هم‌زمان مدیر منطقه نیز سرزده حضور پیدا می‌کند. ترتیب استقبال، معرفی و نشستن را چگونه مدیریت می‌کنید؟",ex:"برای بازدید فرضی مدیرعامل بیمه البرز، چک‌لیست قبل، حین و بعد از بازدید طراحی کنید.",coach:"اگر تشریفات حذف شود، چه چیزی از احترام باقی می‌ماند؟ و اگر افراطی شود، چه چیزی از طبیعی بودن رابطه از بین می‌رود؟",ref:"در شعبه شما کدام بخش از میزبانی و تشریفات بیشترین احتمال خطا دارد؟",asg:"یک جلسه رسمی آینده را از منظر فضا، استقبال، نشستن، پذیرایی و پایان جلسه پیش‌طراحی کنید.",q:[["Protocol بیشتر به چه مربوط است؟",["قواعد رسمی و تقدم","فقط صمیمیت","فقط مشتری","فقط دولت"],0],["تشریفات حرفه‌ای باید چگونه باشد؟",["نمایشی","روان و متناسب","کاملاً غیررسمی","یکسان در همه جا"],1],["قبل از بازدید مهم چه چیز مهم است؟",["فقط اتاق","روشن بودن نقش تیم و هدف","لغو همه جلسات","ایستادن همه در ورودی"],1],["Seating Protocol بر چه اساس است؟",["عادت","هدف جلسه و جایگاه","سن فقط","نزدیکی در"],1],["پایان مناسب بازدید چیست؟",["خداحافظی سریع","جمع‌بندی، بدرقه و پیگیری","هدیه اجباری","جلسه دوم فوری"],1]]},
{id:3,t:"گوش‌دادن فعال، پرسشگری و همدلی حرفه‌ای",s:"فهم مسئله قبل از پاسخ‌دادن",c:["Active Listening","Questioning","Empathy"],o:"با گوش‌دادن فعال و پرسش‌های درست، نیاز واقعی مخاطب را کشف و از پاسخ‌های شتاب‌زده جلوگیری کند.",tp:["Listening vs Hearing","نشانه‌های Active Listening","سؤال باز، بسته، روشن‌کننده و عمیق‌کننده","Reflecting Back و Paraphrasing","Summarizing","همدلی حرفه‌ای بدون موافقت الزامی","کشف نیاز پشت کلمات"],n:["اول بفهمید، بعد پاسخ دهید.","همدلی یعنی فهم تجربه طرف مقابل؛ نه تأیید همه برداشت‌ها.","سؤال خوب اطلاعاتی ایجاد می‌کند که بدون آن سؤال وجود نداشت.","خلاصه‌سازی در پایان، سوءبرداشت را کاهش می‌دهد."],tools:["LACE: Listen → Acknowledge → Clarify → Explore","«چه چیزی این موضوع را برای شما مهم کرده؟»","«اگر درست فهمیده باشم...»","خلاصه ۳۰ ثانیه‌ای قبل از پیشنهاد راه‌حل"],case:"مشتری می‌گوید «این شعبه هیچ‌وقت پاسخگو نیست». اطلاعات نشان می‌دهد درخواست او دیروز ثبت شده است. چگونه بدون دفاعی شدن، مسئله واقعی را کشف می‌کنید؟",ex:"دو نفره: نفر اول یک مسئله واقعی را سه دقیقه توضیح دهد. نفر دوم حق ارائه راه‌حل ندارد؛ فقط سؤال، بازتاب و خلاصه‌سازی.",coach:"در مکالمات سخت، شما بیشتر برای «فهمیدن» گوش می‌دهید یا برای «آماده کردن جواب»؟",ref:"کدام نوع سؤال را کمتر استفاده می‌کنید: باز، روشن‌کننده، عمیق‌کننده یا بازتابی؟",asg:"در یک مکالمه واقعی، قبل از ارائه راه‌حل حداقل سه سؤال روشن‌کننده بپرسید.",q:[["Active Listening چیست؟",["ساکت ماندن","توجه، فهم و بازتاب فعال","تأیید همه حرف‌ها","یادداشت همه کلمات"],1],["کدام سؤال عمیق‌کننده است؟",["آیا ناراحتید؟","چه چیزی پشت این نگرانی است؟","نام شما چیست؟","شماره پرونده؟"],1],["همدلی حرفه‌ای چیست؟",["موافقت کامل","فهم تجربه بدون موافقت الزامی","عذرخواهی دائمی","امتیاز دادن"],1],["Reflecting Back برای چیست؟",["نمایش دانش","بررسی فهم مشترک","طولانی کردن","تغییر موضوع"],1],["خطر راه‌حل دادن زودهنگام چیست؟",["کوتاهی جلسه","تشخیص اشتباه مسئله","رضایت مشتری","پیگیری کمتر"],1]]},
{id:4,t:"فن بیان مدیریتی، لحن و زبان بدن",s:"پیام روشن، حضور حرفه‌ای و هماهنگی کلام و رفتار",c:["Voice","Body Language","Executive Presence"],o:"پیام کوتاه و روشن بسازد و لحن، سرعت، زبان بدن و حضور خود را متناسب با موقعیت مدیریت کند.",tp:["Voice, Tone & Pace","ساختار پیام مدیریتی","وضوح و اختصار","Eye Contact و حالات چهره","Posture و Gesture","فاصله حرفه‌ای","Congruence","Executive Presence"],n:["قدرت پیام از وضوح آن می‌آید، نه پیچیدگی واژگان.","لحن می‌تواند معنای یک جمله درست را خراب کند.","زبان بدن یک نشانه است، نه دستگاه دروغ‌سنج.","در موضوع حساس سرعت صحبت را کمی کاهش دهید."],tools:["3P: Point → Proof → Path","مکث دوثانیه‌ای قبل از پاسخ سخت","Eye Contact طبیعی","پایان جمله کلیدی با افت لحن"],case:"باید کاهش یک اختیار اجرایی را به کارکنان اعلام کنید. تصمیم قطعی است اما تیم ناراضی خواهد شد. پیام را چگونه می‌سازید تا قاطع و محترمانه باشد؟",ex:"یک پیام ۹۰ ثانیه‌ای درباره یک تغییر واقعی اجرا کنید و فقط روی وضوح، لحن، سرعت و زبان بدن Feedback بگیرید.",coach:"وقتی تحت فشار هستید، کدام بخش از حضور حرفه‌ای شما زودتر افت می‌کند: لحن، سرعت، تماس چشمی یا ساختار پیام؟",ref:"یک عادت غیرکلامی شما که ممکن است پیام اشتباه بدهد چیست؟",asg:"یک پیام مدیریتی مهم را با الگوی 3P بنویسید و با صدای بلند تمرین کنید.",q:[["اولین بخش پیام روشن چیست؟",["جزئیات","نکته اصلی","عذرخواهی","تاریخچه"],1],["زبان بدن چگونه تفسیر شود؟",["قطعی","نشانه در کنار Context","بدون کلام","فقط تماس چشمی"],1],["در موضوع حساس چه مفید است؟",["سرعت بیشتر","کاهش سرعت و مکث","صدای بلندتر","کاهش تماس چشمی"],1],["Congruence یعنی چه؟",["هماهنگی کلام و رفتار","تکرار پیام","توافق کامل","رسمیت"],0],["Executive Presence بیشتر از چه می‌آید؟",["لباس گران","وضوح، آرامش و حضور آگاهانه","عنوان","صحبت طولانی"],1]]},
{id:5,t:"ارتباط مؤثر با کارکنان شعبه",s:"اعتماد، Feedback، انتظار روشن و گفت‌وگوی عملکردی",c:["Feedback","Psychological Safety","Performance"],o:"انتظارات را روشن کند، بازخورد رفتاری بدهد و درباره عملکرد بدون تخریب اعتماد گفت‌وگو کند.",tp:["اعتماد و Psychological Safety","شفاف‌سازی انتظار","درخواست کار و Delegation Communication","Feedback و Feedforward","Recognition","اصلاح رفتار بدون حمله به شخصیت","کارمند کم‌انگیزه یا مقاوم"],n:["بازخورد خوب مشخص، رفتاری و نزدیک به زمان رخداد است.","بین شخص و رفتار مرز بگذارید.","انتظار مبهم زمینه تعارض بعدی است.","تقدیر مؤثر دقیق است: چه رفتاری ارزشمند بود و چرا."],tools:["SBI: Situation → Behavior → Impact","Feedforward: دفعه بعد چه کار متفاوتی؟","Expectation Check","Recognition: رفتار + اثر + قدردانی"],case:"کارشناس باتجربه چند بار پاسخ مشتری را با تأخیر داده و در برابر Feedback می‌گوید «من از همه اینجا بیشتر سابقه دارم و می‌دانم کارم را چطور انجام دهم».",ex:"یک Feedback واقعی را با SBI بنویسید و در Role Play اجرا کنید؛ طرف مقابل یک واکنش دفاعی نشان دهد.",coach:"آیا کارکنان شما دقیقاً می‌دانند «عملکرد خوب» در نقش‌شان چه شکلی است یا شما فرض می‌کنید می‌دانند؟",ref:"در Feedback دادن، شما بیشتر پیام را بیش از حد نرم می‌کنید یا بیش از حد مستقیم می‌شوید؟",asg:"این هفته یک Recognition دقیق و یک Feedback مبتنی بر SBI اجرا کنید.",q:[["SBI چیست؟",["Strategy, Behavior, Intention","Situation, Behavior, Impact","Skill, Belief, Insight","Situation, Benefit, Instruction"],1],["بازخورد مؤثر روی چه تمرکز دارد؟",["شخصیت","رفتار قابل مشاهده","حدس نیت","سابقه"],1],["Psychological Safety چیست؟",["نبود استاندارد","امکان بیان نظر و خطا بدون ترس غیرمنطقی","رضایت همه","عدم ارزیابی"],1],["Recognition مؤثر چگونه است؟",["کلی","دقیق و مرتبط با رفتار و اثر","سالانه","فقط مالی"],1],["Feedforward روی چه تمرکز دارد؟",["سرزنش گذشته","اقدام بهتر آینده","مقایسه","ثبت تخلف"],1]]},
{id:6,t:"گفت‌وگوهای دشوار، افراد دشوار و مدیریت تعارض",s:"قاطعیت، De-escalation و مرزبندی حرفه‌ای",c:["Assertiveness","Conflict","Difficult People"],o:"در موقعیت‌های پرتنش قاطع و محترمانه بماند، شدت تنش را کاهش دهد و گفت‌وگو را به مسئله اصلی برگرداند.",tp:["Passive / Aggressive / Assertive","Triggerهای هیجانی","De-escalation","تفکیک شخص، رفتار و مسئله","افراد پرخاشگر، منفی، پرتوقع و همه‌چیزدان","Boundary Setting","بازگرداندن گفت‌وگو به اقدام بعدی"],n:["قاطعیت یعنی وضوح + احترام؛ نه سخت‌گیری.","در اوج هیجان، هدف اول کاهش شدت هیجان است.","مرز حرفه‌ای را کوتاه و روشن بیان کنید.","برچسب «فرد دشوار» را با توصیف رفتار جایگزین کنید."],tools:["DESC: Describe → Express → Specify → Consequence","Broken Record","Name the Emotion بدون قضاوت","Pause–Lower–Refocus"],case:"نماینده‌ای در حضور مشتریان صدای خود را بالا می‌برد و می‌گوید شعبه عمداً کار او را عقب می‌اندازد. چگونه هم شأن او را حفظ می‌کنید و هم رفتار را متوقف؟",ex:"سه Role Play کوتاه: فرد پرخاشگر، منفی و همه‌چیزدان. پاسخ باید Assertive و مبتنی بر مرزبندی باشد.",coach:"وقتی فرد مقابل شدت می‌گیرد، شما شدت خود را بالا می‌برید، عقب‌نشینی می‌کنید یا آگاهانه سرعت را پایین می‌آورید؟",ref:"کدام رفتار دیگران بیشترین Trigger را در شما ایجاد می‌کند و پاسخ حرفه‌ای جایگزین چیست؟",asg:"برای یک مرز واقعی، یک جمله کوتاه Assertive بنویسید و در موقعیت مناسب استفاده کنید.",q:[["Assertiveness چیست؟",["حمله","بیان روشن نیاز و مرز همراه با احترام","سکوت","امتیاز دادن"],1],["در اوج هیجان اولویت چیست؟",["اثبات حق","کاهش شدت هیجان","ارائه اسناد","خاتمه رابطه"],1],["Broken Record برای چیست؟",["تکرار توهین","حفظ مرز با تکرار آرام پیام","تغییر موضوع","فشار بیشتر"],1],["در افراد دشوار روی چه تمرکز کنیم؟",["شخصیت","رفتار و اثر","شایعات","نیت پنهان"],1],["DESC با چه شروع می‌شود؟",["تهدید","توصیف رفتار/واقعیت","راه‌حل","پیامد"],1]]},
