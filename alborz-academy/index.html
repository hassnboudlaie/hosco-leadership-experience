<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>آکادمی مهارت‌های ارتباطات اثربخش | بیمه البرز</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');
:root{--navy:#173d5d;--teal:#168b8b;--bg:#f5f8fa;--ink:#263746;--muted:#6c7a84;--line:#dce7eb;--soft:#eef7f7}
*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.85}a{text-decoration:none;color:inherit}.wrap{max-width:1120px;margin:auto;padding:0 20px}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.topin{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--navy),var(--teal));color:#fff;display:grid;place-items:center;font-weight:800}.brand b{color:var(--navy)}.brand small{display:block;color:var(--muted);font-size:10px}.nav{display:flex;gap:8px}.nav a{font-size:12px;padding:7px 10px;border-radius:8px}.nav a:hover{background:var(--soft)}.hero{padding:50px 0 34px;background:linear-gradient(#fff,var(--bg))}.hero h1{color:var(--navy);font-size:34px;margin:10px 0}.hero p{max-width:850px;color:var(--muted);margin:0}.tag{display:inline-block;background:var(--soft);color:var(--teal);border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700}.summary{margin-top:20px;display:flex;gap:9px;flex-wrap:wrap}.pill{background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:11px}.section{padding:28px 0}.section h2{color:var(--navy);margin:0 0 5px}.sub{color:var(--muted);font-size:12px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:0 8px 22px rgba(23,61,93,.05);transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(23,61,93,.08)}.num{font-size:11px;color:var(--teal);font-weight:700}.card h3{color:var(--navy);font-size:17px;margin:6px 0}.card p{font-size:12px;color:var(--muted);margin:0 0 12px}.topics{display:flex;gap:6px;flex-wrap:wrap}.topic{background:#f2f7f8;border-radius:999px;padding:3px 7px;font-size:10px;color:#506572}.go{display:flex;justify-content:space-between;align-items:center;margin-top:14px;border-top:1px dashed var(--line);padding-top:11px;font-size:11px}.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--navy);color:#fff;padding:9px 13px;border-radius:10px;font-family:inherit;cursor:pointer}.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}.session{padding:34px 0}.crumb{font-size:11px;color:var(--muted);margin-bottom:10px}.box{background:linear-gradient(135deg,var(--navy),#216c7a);color:#fff;border-radius:20px;padding:25px}.box h1{font-size:28px;margin:6px 0}.box p{color:#dcebf0;margin:0}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.meta span{background:rgba(255,255,255,.12);padding:4px 8px;border-radius:999px;font-size:10px}.content{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px}.panel.full{grid-column:1/-1}.panel h2{color:var(--navy);font-size:18px;margin:0 0 10px}.panel ul{padding-right:19px;margin:0}.panel li{margin-bottom:6px}.placeholder{border:1px dashed #b9ccd3;background:#fbfdfd;border-radius:12px;padding:15px;color:var(--muted);font-size:12px}.footer{margin-top:35px;border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:11px}.guide{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;margin-bottom:14px}
@media(max-width:820px){.grid,.content{grid-template-columns:1fr}.panel.full{grid-column:auto}.hero h1{font-size:28px}.box h1{font-size:23px}.nav{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const sessions=[
{id:1,title:"نقش رئیس شعبه در مدیریت ارتباطات و آداب معاشرت حرفه‌ای",desc:"شناخت ذی‌نفعان، First Impression، Social Etiquette و انتخاب لحن و کانال مناسب.",topics:["Stakeholder Map","First Impression","Social Etiquette","لحن و کانال"],goal:"رئیس شعبه بتواند برای هر ذی‌نفع، سبک ارتباطی و رفتار حرفه‌ای متناسب انتخاب کند.",outline:["نقش رئیس شعبه به‌عنوان نماینده برند","شناخت ذی‌نفعان اصلی شعبه","آداب معرفی، سلام و احوالپرسی","اولین برداشت و حضور حرفه‌ای","انتخاب لحن، زمان و کانال مناسب"]},
{id:2,title:"تشریفات و Protocol برای رؤسای شعب",desc:"اصول میزبانی، تقدم، معرفی، نشستن و مدیریت بازدیدهای رسمی.",topics:["Protocol","Hosting","Seating","VIP Visit"],goal:"رئیس شعبه بتواند موقعیت‌های رسمی و بازدیدهای مهم را حرفه‌ای و منظم مدیریت کند.",outline:["تفاوت Etiquette و Protocol","استقبال و بدرقه","تقدم و معرفی افراد","نحوه نشستن در جلسات","اصول میزبانی و پذیرایی","آمادگی شعبه برای بازدید رسمی"]},
{id:3,title:"گوش‌دادن فعال، پرسشگری و همدلی حرفه‌ای",desc:"فهم درست مسئله قبل از پاسخ‌دادن و راه‌حل ارائه‌کردن.",topics:["Active Listening","Questioning","Empathy","Clarification"],goal:"رئیس شعبه بتواند با گوش‌دادن و پرسشگری، مسئله و نیاز واقعی مخاطب را بهتر درک کند.",outline:["شنیدن در برابر گوش‌دادن فعال","سؤال‌های باز و بسته","سؤال‌های روشن‌کننده و عمیق‌کننده","Reflecting Back و Summarizing","همدلی حرفه‌ای"]},
{id:4,title:"فن بیان مدیریتی، لحن و زبان بدن",desc:"ساخت پیام روشن، مدیریت لحن و استفاده آگاهانه از نشانه‌های غیرکلامی.",topics:["Voice","Tone","Body Language","Executive Presence"],goal:"رئیس شعبه بتواند پیام خود را روشن، کوتاه و متناسب با موقعیت منتقل کند.",outline:["وضوح و اختصار در پیام مدیریتی","Voice, Tone & Pace","تماس چشمی و حالات چهره","Posture و Gesture","هماهنگی کلام و رفتار","حضور حرفه‌ای"]},
{id:5,title:"ارتباط مؤثر با کارکنان شعبه",desc:"اعتماد، شفاف‌سازی انتظار، بازخورد و گفت‌وگوی عملکردی.",topics:["Feedback","Trust","Performance","Psychological Safety"],goal:"رئیس شعبه بتواند گفت‌وگوهای روزمره و عملکردی با کارکنان را اثربخش‌تر مدیریت کند.",outline:["اعتماد و Psychological Safety","شفاف‌سازی انتظار","درخواست و واگذاری کار","Feedback و Feedforward","Recognition","گفت‌وگو با کارکنان کم‌انگیزه یا مقاوم"]},
{id:6,title:"گفت‌وگوهای دشوار، افراد دشوار و مدیریت تعارض",desc:"قاطعیت، کنترل هیجان، کاهش تنش و مرزبندی حرفه‌ای.",topics:["Assertiveness","Conflict","De-escalation","Boundaries"],goal:"رئیس شعبه بتواند در موقعیت‌های دشوار، قاطع و محترمانه باقی بماند.",outline:["رفتار منفعلانه، پرخاشگرانه و قاطعانه","Triggerهای هیجانی","De-escalation","تفکیک شخص از رفتار","انواع افراد دشوار","مرزبندی حرفه‌ای"]},
{id:7,title:"ارتباط با ستاد، همکاران و سایر شعب",desc:"همکاری بین‌واحدی، پیگیری حرفه‌ای، مخالفت و Escalation.",topics:["Cross-functional","Follow-up","Escalation","Coordination"],goal:"رئیس شعبه بتواند تعاملات بین‌واحدی را با وضوح، احترام و پیگیری مؤثر مدیریت کند.",outline:["ارتباط افقی و عمودی","درخواست همکاری","پیگیری حرفه‌ای","بیان مخالفت","Escalation صحیح","مستندسازی توافقات"]},
{id:8,title:"ارتباط و مدیریت رابطه با نمایندگان",desc:"اعتمادسازی، مدیریت انتظار، نه گفتن حرفه‌ای و حفظ مرزهای نقش.",topics:["Representatives","Partnership","Expectations","Boundaries"],goal:"رئیس شعبه بتواند رابطه‌ای مشارکتی و در عین حال حرفه‌ای با نمایندگان ایجاد کند.",outline:["جایگاه نماینده در شبکه ارتباطی شعبه","اعتمادسازی","مدیریت انتظار","نه گفتن حرفه‌ای","Feedback به نماینده","نماینده ناراضی یا پرتوقع"]},
{id:9,title:"ارتباط با مشتری، تجربه مشتری و مدیریت شکایت",desc:"فهم نیاز، مدیریت انتظار، مشتری ناراضی و Service Recovery.",topics:["Customer Experience","Complaint","Service Recovery","Need"],goal:"رئیس شعبه بتواند نارضایتی و شکایت مشتری را ساختاریافته و حرفه‌ای مدیریت کند.",outline:["لحظات حساس تجربه مشتری","Listening for Need","مدیریت انتظار","مشتری عصبانی و ناراضی","عذرخواهی حرفه‌ای","Service Recovery"]},
{id:10,title:"مشتری سازمانی، اقناع و مذاکره + ارتباطات دیجیتال",desc:"B2B Communication، کشف نیاز، ارزش‌آفرینی، اعتراض و Follow-up.",topics:["B2B","Persuasion","Negotiation","Digital Etiquette"],goal:"رئیس شعبه بتواند ارتباط اولیه و جلسه حرفه‌ای با مشتری سازمانی را ساختاریافته مدیریت کند.",outline:["تفاوت B2B و B2C","آمادگی قبل از جلسه","Discovery Questions","Value Conversation","اصول پایه اقناع و مذاکره","Telephone, WhatsApp & Email Etiquette","Follow-up و ثبت توافقات"]}
];

function header(){return '<header class="top"><div class="wrap topin"><a class="brand" href="?"><span class="logo">ا</span><span><b>آکادمی ارتباطات رؤسای شعب</b><small>بیمه البرز | نسخه پایه ۱۰ جلسه‌ای</small></span></a><nav class="nav"><a href="?">جلسات</a><a href="?view=guide">راهنما</a></nav></div></header>'}
function footer(){return '<footer class="footer"><div class="wrap">این نسخه عمداً در سطح کلیات نگه داشته شده است. محتوای تفصیلی، جزوه، تمرین و آزمون هر جلسه در مرحله بعد و به‌صورت جلسه‌به‌جلسه توسعه خواهد یافت.</div></footer>'}
function home(){
document.title="آکادمی مهارت‌های ارتباطات اثربخش | بیمه البرز";
document.getElementById("app").innerHTML=header()+
'<main><section class="hero"><div class="wrap"><span class="tag">نسخه پایه و قابل توسعه</span><h1>مهارت‌های ارتباطات اثربخش و رفتار حرفه‌ای رؤسای شعب بیمه البرز</h1><p>این نسخه فقط معماری کلی دوره را نشان می‌دهد. ۱۰ جلسه اصلی در دسترس‌اند و هر جلسه یک صفحه مستقل دارد. فعلاً داخل هر جلسه فقط Overview و محورهای اصلی قرار گرفته تا در ادامه، جلسه‌به‌جلسه جزوه، تمرین، تست، Case و ابزارهای کاربردی را با هم تکمیل کنیم.</p><div class="summary"><span class="pill">۱۰ جلسه</span><span class="pill">هر جلسه ۲ ساعت</span><span class="pill">مسیر غیرخطی</span><span class="pill">لینک مستقل برای هر جلسه</span><span class="pill">قابل توسعه به ۲ یا ۳ جلسه برای هر ماژول</span></div></div></section><section class="section"><div class="wrap"><h2>جلسات دوره</h2><div class="sub">برای دیدن کلیات هر جلسه روی کارت آن کلیک کنید.</div><div class="grid">'+
sessions.map(s=>'<a class="card" href="?m='+s.id+'"><div class="num">جلسه '+s.id+'</div><h3>'+s.title+'</h3><p>'+s.desc+'</p><div class="topics">'+s.topics.map(t=>'<span class="topic">'+t+'</span>').join('')+'</div><div class="go"><span>مشاهده کلیات جلسه</span><span>←</span></div></a>').join('')+
'</div></div></section></main>'+footer()
}
function sessionPage(id){
const s=sessions.find(x=>x.id===id); if(!s){home();return}
document.title='جلسه '+id+' | '+s.title;
document.getElementById("app").innerHTML=header()+
'<main><section class="session"><div class="wrap"><div class="crumb"><a href="?">داشبورد جلسات</a> ← جلسه '+id+'</div><div class="box"><span class="tag" style="background:rgba(255,255,255,.13);color:#fff">جلسه '+id+' از ۱۰</span><h1>'+s.title+'</h1><p>'+s.desc+'</p><div class="meta"><span>مدت پایه: ۲ ساعت</span><span>نسخه فعلی: Overview</span><span>قابل توسعه در مرحله بعد</span></div></div>'+
'<div class="content">'+
'<section class="panel"><h2>هدف کلی جلسه</h2><p>'+s.goal+'</p></section>'+
'<section class="panel"><h2>محورهای اصلی</h2><ul>'+s.outline.map(i=>'<li>'+i+'</li>').join('')+'</ul></section>'+
'<section class="panel full"><h2>آنچه در مرحله بعد اضافه می‌کنیم</h2><div class="placeholder">جزوه آموزشی تفصیلی، پیام‌های کلیدی مدرس، Caseهای واقعی بیمه‌ای، تمرین و Role Play، تکنیک‌ها و Checklistها، آزمون کوتاه، Reflection و تکلیف انتقال یادگیری. این موارد فعلاً عمداً وارد نشده‌اند تا هر جلسه را جداگانه طراحی و نهایی کنیم.</div></section>'+
'</div><div style="display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap;margin-top:20px"><a class="btn alt" href="'+(id>1?'?m='+(id-1):'?')+'">جلسه قبل</a><button class="btn alt" onclick="navigator.clipboard.writeText(location.href).then(()=>alert(\'لینک مستقل جلسه کپی شد.\'))">کپی لینک مستقل</button><a class="btn" href="'+(id<10?'?m='+(id+1):'?')+'">'+(id<10?'جلسه بعد':'بازگشت به داشبورد')+'</a></div></div></section></main>'+footer()
}
function guide(){
document.title="راهنمای استفاده | آکادمی ارتباطات بیمه البرز";
document.getElementById("app").innerHTML=header()+
'<main><section class="hero"><div class="wrap"><span class="tag">راهنمای استفاده</span><h1>فعلاً فقط معماری دوره</h1><p>این نسخه برای دیدن ساختار ۱۰ جلسه و کلیات هر ماژول است. مسیر یادگیری خطی و اجباری نیست و هر جلسه لینک مستقل دارد.</p></div></section><section class="section"><div class="wrap"><div class="guide"><b>مرحله فعلی</b><p>عنوان، هدف، محورهای اصلی و صفحه مستقل هر جلسه آماده است.</p></div><div class="guide"><b>مرحله بعد</b><p>هر بار فقط یک جلسه را انتخاب می‌کنیم و محتوای همان جلسه را کامل می‌کنیم؛ نه جلسه‌های بعدی را.</p></div><div class="guide"><b>خروجی نهایی هر جلسه</b><p>جزوه + نکات کلیدی + تمرین + Case + تکنیک + آزمون + Reflection + تکلیف انتقال یادگیری.</p></div></div></section></main>'+footer()
}
const params=new URLSearchParams(location.search); const m=Number(params.get("m")); const view=params.get("view");
if(m)sessionPage(m); else if(view==="guide")guide(); else home();
</script>
</body>
</html>
